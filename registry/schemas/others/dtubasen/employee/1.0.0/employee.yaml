type: object
additionalProperties: false
description: >
  Employee record read from the DTUBasen database
  (view View_DTUIP_Employee_2_0).
required:
  - cwisNo
properties:
  cwisNo:
    type: integer
    format: int64
    description: CWIS primary key.
  email:
    type: string
    format: email
    maxLength: 254
    pattern: '^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$'
    description: Official email address (official_email).
  username:
    type: string
    maxLength: 100
    pattern: '^[A-Za-z0-9._\-@]{0,100}$'
  firstName:
    type: string
    maxLength: 150
    pattern: "^.{0,150}$"
  lastName:
    type: string
    maxLength: 150
    pattern: "^.{0,150}$"
  namePreferred:
    type: string
    maxLength: 300
    pattern: "^.{0,300}$"
    description: Preferred full name.
  firstNamePreferred:
    type: string
    maxLength: 150
    pattern: "^.{0,150}$"
    description: Preferred first name.
  lastNamePreferred:
    type: string
    maxLength: 150
    pattern: "^.{0,150}$"
    description: Preferred last name.
  initials:
    type: string
    maxLength: 10
    pattern: "^[A-Za-z]{0,10}$"
  orgUnitId:
    type: integer
    format: int64
    description: Organisation unit identifier.
  orgUnitNameDa:
    type: string
    maxLength: 300
    pattern: "^.{0,300}$"
    description: Organisation unit name in Danish.
  orgUnitNameEn:
    type: string
    maxLength: 300
    pattern: "^.{0,300}$"
    description: Organisation unit name in English.
  titleDa:
    type: string
    maxLength: 240
    pattern: "^.{0,240}$"
    description: Job title in Danish.
  titleEn:
    type: string
    maxLength: 240
    pattern: "^.{0,240}$"
    description: Job title in English.
  active:
    type: boolean
    description: Whether the person is currently active.
  street:
    type: string
    maxLength: 200
    pattern: "^.{0,200}$"
  building:
    type: string
    maxLength: 50
    pattern: '^[A-Za-z0-9\-]{0,50}$'
  room:
    type: string
    maxLength: 20
    pattern: '^[A-Za-z0-9\-]{0,20}$'
  floor:
    type: string
    maxLength: 20
    pattern: "^.{0,20}$"
  zipCode:
    type: string
    maxLength: 20
    pattern: '^[A-Za-z0-9 \-]{0,20}$'
  city:
    type: string
    maxLength: 100
    pattern: "^.{0,100}$"
  country:
    type: string
    maxLength: 100
    pattern: "^.{0,100}$"
  studienummer:
    type: string
    maxLength: 50
    pattern: '^[A-Za-z0-9\-]{0,50}$'
    description: Student number, if applicable.
  updated:
    type: string
    format: date-time
    description: Last updated timestamp.
  profileId:
    type: integer
    format: int64
    description: Profile identifier.
  isPrimaryProfile:
    type: boolean
    description: Whether this is the primary profile.
  cardNumber:
    type: string
    maxLength: 50
    pattern: '^[A-Za-z0-9\-]{0,50}$'
    description: DTU card number.
  nameAndAddressProtected:
    type: boolean
    description: Whether the person's name and address are protected.
