type: object
properties:
  projectId:
    type: integer
    format: int64
  projectNumber:
    type: string
  projectName:
    type: string
  projectDescription:
    type: string
  projectStartDate:
    type: string
    format: date
  projectStatusName:
    type: string
  projectStatusCode:
    type: string
  projectTypeId:
    type: integer
    format: int64
  projectType:
    type: string
  projectUnitId:
    type: integer
    format: int64
  workTypeId:
    type: integer
    format: int64
  capitalCostTypeCode:
    type: string
  projectCurrencyCode:
    type: string
  sourceTemplateId:
    type: integer
    format: int64
  legalEntityId:
    type: integer
    format: int64
  owningOrganizationId:
    type: integer
    format: int64
  enableBillingFlag:
    type: boolean
  enableCapitalizationFlag:
    type: boolean
  priorityCode:
    type: string
  serviceTypeCode:
    type: string
  projectEndDate:
    type: string
    format: date
  projectCompletionDate:
    type: string
    format: date
    description: >
      The date on which project work was completed, derived from the most recent
      PENDING_CLOSE entry in the project's status history.
  projectClosedDate:
    type: string
    format: date
    description: >
      The date on which the project was fully closed, derived from the most recent
      CLOSED entry in the project's status history.
