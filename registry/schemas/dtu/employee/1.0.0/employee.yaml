type: object
additionalProperties: false
description: >
  Employee record read from the TX_HUB_Topics DIP database
  (view employee.employee_02_01).
  Adjust field names and types here — and the corresponding column mappings
  in DipEmployeeRepository.mapRow() — to match the actual view definition.
required:
  - cwisNo
properties:
  cwisNo:
    type: integer
    format: int64
    description: CWIS primary key.
  username:
    type: string
    maxLength: 100
    pattern: '^[A-Za-z0-9._\-@]{0,100}$'
  initials:
    type: string
    maxLength: 10
    pattern: "^[A-Za-z]{0,10}$"
  cprNumber:
    type: string
    maxLength: 11
    pattern: '^[0-9X\-]{0,11}$'
    description: CPR number (masked).
  firstName:
    type: string
    maxLength: 150
    pattern: "^.{0,150}$"
  lastName:
    type: string
    maxLength: 150
    pattern: "^.{0,150}$"
  genderCode:
    type: string
    maxLength: 1
    pattern: "^[A-Z]$"
  citizenshipCodes:
    type: string
    maxLength: 100
    pattern: "^.{0,100}$"
  dtuCardNo:
    type: string
    maxLength: 20
    pattern: "^[A-Za-z0-9]{0,20}$"
  employeeNumber:
    type: string
    maxLength: 30
    pattern: '^[A-Za-z0-9\-]{0,30}$'
    description: Business employee number.
  employeeTitleEn:
    type: string
    maxLength: 240
    pattern: "^.{0,240}$"
    description: Official employee title in English.
  employeeTitleDa:
    type: string
    maxLength: 240
    pattern: "^.{0,240}$"
    description: Official employee title in Danish.
  jobTitle:
    type: string
    maxLength: 240
    pattern: "^.{0,240}$"
    description: Preferred employee title in English.
  employeeTitlePreferredDa:
    type: string
    maxLength: 240
    pattern: "^.{0,240}$"
    description: Preferred employee title in Danish.
  email:
    type: string
    format: email
    maxLength: 254
    pattern: '^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$'
  dateOfEmployment:
    type: string
    format: date
  dateOfEmploymentTermination:
    type: string
    format: date
  dateOfEmploymentProjectedTermination:
    type: string
    format: date
  lineManagerCwis:
    type: integer
    format: int64
    description: CWIS number of the line manager.
  lineManagerFirstNames:
    type: string
    maxLength: 150
    pattern: "^.{0,150}$"
  lineManagerLastName:
    type: string
    maxLength: 150
    pattern: "^.{0,150}$"
  orgNo:
    type: string
    maxLength: 30
    pattern: '^[A-Za-z0-9\-]{0,30}$'
    description: Organisation number.
  locationCode:
    type: string
    maxLength: 30
    pattern: '^[A-Za-z0-9_\-]{0,30}$'
  buildingNo:
    type: string
    maxLength: 20
    pattern: '^[A-Za-z0-9\-]{0,20}$'
  roomNo:
    type: string
    maxLength: 20
    pattern: '^[A-Za-z0-9\-]{0,20}$'
  buildingAddress:
    type: string
    maxLength: 240
    pattern: "^.{0,240}$"
  deliveryAddress1:
    type: string
    maxLength: 240
    pattern: "^.{0,240}$"
  deliveryAddress2:
    type: string
    maxLength: 240
    pattern: "^.{0,240}$"
  deliveryPostalCode:
    type: string
    maxLength: 20
    pattern: '^[A-Za-z0-9 \-]{0,20}$'
  deliveryCity:
    type: string
    maxLength: 60
    pattern: "^.{0,60}$"
  deliveryCountryCode:
    type: string
    maxLength: 2
    pattern: "^[A-Z]{2}$"
  orgFormalNameEn:
    type: string
    maxLength: 240
    pattern: "^.{0,240}$"
    description: Formal organisation name in English.
  orgFormalNameDa:
    type: string
    maxLength: 240
    pattern: "^.{0,240}$"
    description: Formal organisation name in Danish.
  departmentId:
    type: integer
    format: int64
    description: Foreign key to the department (legacy_id1).
  status:
    type: string
    maxLength: 10
    pattern: "^[A-Z_]{0,10}$"
    description: Employment status (computed from is_deleted_record / is_current_record).
